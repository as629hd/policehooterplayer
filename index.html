<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Police Hooter</title>

<style>
body {
    margin: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: black;
    font-family: Arial, sans-serif;
    gap: 20px;
}

button {
    padding: 20px 40px;
    font-size: 22px;
    background: red;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
}

button:active {
    transform: scale(0.95);
}

label {
    color: white;
    font-size: 16px;
}

input[type="range"] {
    width: 220px;
    accent-color: red;
}

.hint {
    color: #aaa;
    font-size: 14px;
}
</style>
</head>

<body>

<button onclick="toggleSound()">PLAY HOOTER</button>

<div class="hint">Press <b>L</b> to Play / Stop 🚨</div>

<label>Volume</label>
<input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">

<audio id="hooter" src="hooter.mp3"></audio>

<script>
const audio = document.getElementById("hooter");
const button = document.querySelector("button");
const volumeSlider = document.getElementById("volume");

let isPlaying = false;
let activated = false;

audio.volume = 0.5;

volumeSlider.addEventListener("input", () => {
    audio.volume = volumeSlider.value;
});

function toggleSound() {
    activated = true;

    if (!isPlaying) {
        audio.play();
        button.textContent = "STOP HOOTER";
    } else {
        audio.pause();
        audio.currentTime = 0;
        button.textContent = "PLAY HOOTER";
    }
    isPlaying = !isPlaying;
}

document.addEventListener("keydown", (e) => {
    if (!activated) return;

    if (e.key.toLowerCase() === "l") {
        toggleSound();
    }
});
</script>

</body>
</html>
